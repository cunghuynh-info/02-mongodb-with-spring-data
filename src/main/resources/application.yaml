spring:
  # Spring Boot 4 moved the connection properties out from under spring.data.mongodb
  # (spring.data.mongodb.uri is deprecated at error level since 4.0). Getting this wrong is
  # quiet rather than loud: the driver falls back to mongodb://localhost/test and every query
  # returns nothing - which is what LabStartupCheck is there to catch.
  mongodb:
    # directConnection=true keeps the driver talking to the container directly instead of
    # chasing the replica-set member's internal hostname, which does not resolve from the host.
    uri: ${MONGO_URI:mongodb://root:example@localhost:27017/sample_mflix?authSource=admin&directConnection=true}
  data:
    mongodb:
      # Indexes are declared explicitly in configuration, not derived from @Indexed at startup.
      auto-index-creation: false

springdoc:
  # Swagger UI chỉ hiện những endpoint nằm trong kịch bản demo
  # (docs/details/DEMO-SWAGGER.vi.md). Các endpoint bị loại vẫn chạy bình thường -
  # đây chỉ là bộ lọc cho tài liệu OpenAPI, không phải cấu hình routing.
  # Muốn hiện lại đầy đủ: comment cả khối paths-to-exclude bên dưới.
  paths-to-exclude:
    # "4 - My comments" - phần ownership của Spring Security, không thuộc 7 nội dung demo
    - /api/comments/**
    # Chỉ giữ /auth/login và /auth/me; đăng ký và vòng đời refresh token là phần security riêng
    - /api/auth/register
    - /api/auth/refresh
    - /api/auth/logout
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    # Endpoints are grouped by @Tag (phase); within a group, keep the declared order rather
    # than sorting alphabetically - the phases tell a story and alpha order destroys it.
    tags-sorter: alpha
    # The whole repo is about measurements, so the UI may as well report them.
    display-request-duration: true
    # Collapsed by default: there are ~50 operations and an expanded list is unreadable.
    doc-expansion: none
    persist-authorization: true

lab:
  security:
    # The iss claim, and what the decoder insists on seeing.
    issuer: mongodb-lab
    access-token-ttl: 15m
    refresh-token-ttl: 14d

    # Empty means no cross-origin call is allowed at all - add an origin only when something
    # in a browser actually needs one. Never "*".
    allowed-origins: []

    jwt:
      # Base64 PKCS#8 RSA private key. Left empty, a keypair is generated at every startup, so a
      # devtools restart invalidates the token in http/requests.http mid-session. Set
      # LAB_JWT_PRIVATE_KEY to keep one across restarts; see .env.example for how to make one.
      private-key: ${LAB_JWT_PRIVATE_KEY:}

    seed:
      # On, because the sample users' passwords are BCrypt hashes of plaintext nobody has - with
      # this off there is no way to log in at all. It only ever upserts the three lab accounts
      # and never touches the sample rows. The property defaults to false in code, so an
      # environment that does not ship this file seeds nothing.
      enabled: true
      password: ${LAB_SEED_PASSWORD:lab-password}

logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: INFO
